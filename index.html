<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzübersicht</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <header>
        <h1>Finanzübersicht</h1>
        <div style="display:flex;align-items:center;gap:1rem;">
            <div class="period-toggle">
                <button class="active" onclick="setPeriod('month',this)">Monat</button>
                <button onclick="setPeriod('year',this)">Jahr</button>
            </div>
            <span id="date-label"></span>
        </div>
    </header>

    <!-- SUMMARY STRIP -->
    <div class="summary">
        <div class="summary-cell">
            <label>Einnahmen</label>
            <div class="val green" id="s-income">—</div>
            <div class="sub" id="s-income-sub"></div>
        </div>
        <div class="summary-cell">
            <label>Fixkosten</label>
            <div class="val" id="s-costs">—</div>
            <div class="sub" id="s-costs-pct"></div>
        </div>
        <div class="summary-cell">
            <label>Sparquote</label>
            <div class="val" id="s-savings-pct">—</div>
            <div class="sub" id="s-savings-abs"></div>
        </div>
        <div class="summary-cell">
            <label>Gesamtvermögen</label>
            <div class="val green" id="s-wealth">—</div>
            <div class="sub" id="s-wealth-sub"></div>
        </div>
    </div>

    <!-- FREI VERFÜGBAR BANNER -->
    <div class="free-banner">
        <div>
            <div class="label">Frei verfügbar</div>
            <div class="amount positive" id="free-amount">—</div>
        </div>
        <div class="free-breakdown">
            <span><span>Einnahmen</span><span id="fb-income">—</span></span>
            <span><span>− Fixkosten</span><span id="fb-costs">—</span></span>
            <span><span>− Sparbetrag</span><span id="fb-save">—</span></span>
        </div>
    </div>

    <div class="grid">

        <!-- EINNAHMEN -->
        <div class="section">
            <div class="section-head">
                <h2>Einnahmen</h2>
                <div class="total" id="income-total">0 €</div>
            </div>
            <div id="income-list"></div>
            <button class="add-btn" onclick="addItem('income')">+ Position</button>
        </div>

        <!-- FIXKOSTEN -->
        <div class="section">
            <div class="section-head">
                <h2>Fixkosten</h2>
                <div class="total" id="costs-total">0 €</div>
            </div>
            <div id="costs-list"></div>
            <button class="add-btn" onclick="addItem('costs')">+ Position</button>
        </div>

        <!-- SPARQUOTE -->
        <div class="section savings-section">
            <div class="section-head">
                <h2>Sparquote</h2>
            </div>
            <div class="savings-body">
                <div class="savings-controls">
                    <div class="slider-row">
                        <label>Sparrate <span id="rate-label">20%</span></label>
                        <input type="range" id="savings-rate" min="0" max="80" value="20" oninput="onRateChange(this.value)">
                        <div class="bar-wrap" style="margin-top:0.6rem">
                            <div class="bar-fill" id="savings-bar" style="width:20%"></div>
                        </div>
                    </div>
                    <div class="slider-row">
                        <label>Fixkosten-Anteil <span id="costs-pct-label">—</span></label>
                        <div class="bar-wrap">
                            <div class="bar-fill" id="costs-bar" style="width:0%"></div>
                        </div>
                    </div>
                </div>
                <div class="savings-stats">
                    <div class="stat-row"><span class="k">Sparbetrag / Monat</span><span class="v g" id="st-monthly">—</span></div>
                    <div class="stat-row"><span class="k">Sparbetrag / Jahr</span><span class="v g" id="st-yearly">—</span></div>
                    <div class="stat-row"><span class="k">In 5 Jahren</span><span class="v" id="st-5y">—</span></div>
                    <div class="stat-row"><span class="k">In 10 Jahren</span><span class="v" id="st-10y">—</span></div>
                </div>
            </div>
        </div>

        <!-- VERMÖGENSENTWICKLUNG -->
        <div class="section wealth-section">
            <div class="section-head">
                <h2>Vermögensentwicklung</h2>
            </div>
            <div class="wealth-body">
                <div class="wealth-input-group">
                    <div class="field-label">Aktuelles Vermögen (€)</div>
                    <input class="field-input" type="number" id="w-current" placeholder="0" oninput="recalc()">
                </div>
                <div class="wealth-input-group">
                    <div class="field-label">Rendite p.a. (%)</div>
                    <input class="field-input" type="number" id="w-return" placeholder="5" value="5" oninput="recalc()">
                </div>
                <div class="wealth-input-group">
                    <div class="field-label">Prognose</div>
                    <div style="display:flex;flex-direction:column;gap:0.4rem;margin-top:0.25rem;">
                        <div class="stat-row" style="padding:0.3rem 0"><span class="k">+1 J</span><span class="v" id="wp-1y">—</span></div>
                        <div class="stat-row" style="padding:0.3rem 0"><span class="k">+5 J</span><span class="v" id="wp-5y">—</span></div>
                        <div class="stat-row" style="padding:0.3rem 0"><span class="k">+10 J</span><span class="v" id="wp-10y">—</span></div>
                        <div class="stat-row" style="padding:0.3rem 0"><span class="k">+20 J</span><span class="v g" id="wp-20y">—</span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ZIELE -->
        <div class="section goal-section">
            <div class="section-head">
                <h2>Ziele</h2>
                <button class="add-btn" style="width:auto;padding:0.25rem 0.65rem;margin-top:0;border-style:solid;" onclick="addGoal()">+ Ziel</button>
            </div>
            <div class="goal-body" id="goals-list"></div>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
