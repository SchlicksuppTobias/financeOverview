<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzübersicht</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f2ee;
            --surface: #faf8f5;
            --border: #e2ddd7;
            --text: #1a1714;
            --muted: #8a8278;
            --accent: #2d5a27;
            --accent-light: #e8f0e7;
            --danger: #8b2e1a;
            --danger-light: #f5ebe8;
            --warn: #7a5c1e;
            --warn-light: #f5f0e5;
            --mono: 'DM Mono', monospace;
            --serif: 'DM Serif Display', serif;
        }

        body {
            font-family: var(--mono);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem 1rem 4rem;
        }

        .container { max-width: 860px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 3rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-family: var(--serif);
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        header span {
            font-size: 0.72rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* ── SUMMARY STRIP ── */
        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 2.5rem;
        }

        .summary-cell {
            background: var(--surface);
            padding: 1.25rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .summary-cell label {
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .summary-cell .val {
            font-family: var(--serif);
            font-size: 1.7rem;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .val.green { color: var(--accent); }
        .val.red   { color: var(--danger); }

        .summary-cell .sub {
            font-size: 0.68rem;
            color: var(--muted);
        }

        /* ── TWO-COL GRID ── */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        /* ── SECTIONS ── */
        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1.5rem;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .section-head h2 {
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 500;
        }

        .section-head .total {
            font-family: var(--serif);
            font-size: 1.1rem;
            letter-spacing: -0.01em;
        }

        /* ── LINE ITEMS ── */
        .line-item {
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 0.5rem 1rem;
            padding: 0.45rem 0;
            border-bottom: 1px solid var(--border);
            animation: fadeIn 0.2s ease;
        }

        .line-item:last-child { border-bottom: none; }

        .line-name {
            font-size: 0.82rem;
            color: var(--text);
            background: none;
            border: none;
            font-family: var(--mono);
            width: 100%;
            outline: none;
            cursor: pointer;
            padding: 0;
        }

        .line-name:focus { color: var(--accent); }

        .line-amount {
            font-size: 0.82rem;
            font-family: var(--mono);
            text-align: right;
            background: none;
            border: none;
            outline: none;
            width: 90px;
            color: var(--text);
            cursor: pointer;
        }

        .line-amount:focus {
            background: var(--accent-light);
            border-radius: 2px;
            padding: 1px 4px;
        }

        .line-del {
            background: none;
            border: none;
            color: var(--border);
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1;
            padding: 0 2px;
            transition: color 0.15s;
        }

        .line-del:hover { color: var(--danger); }

        .add-btn {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.85rem;
            background: none;
            border: 1px dashed var(--border);
            border-radius: 3px;
            padding: 0.45rem 0.75rem;
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--muted);
            cursor: pointer;
            width: 100%;
            transition: all 0.15s;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .add-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ── SPARQUOTE ── */
        .savings-section { grid-column: span 2; }

        .savings-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: center;
        }

        .savings-controls { display: flex; flex-direction: column; gap: 1rem; }

        .slider-row label {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            color: var(--muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .slider-row label span { font-family: var(--serif); font-size: 1rem; color: var(--text); }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 2px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--surface);
            box-shadow: 0 0 0 1px var(--accent);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }

        .savings-stats {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
        }

        .stat-row:last-child { border-bottom: none; }
        .stat-row .k { color: var(--muted); }
        .stat-row .v { font-family: var(--serif); font-size: 1rem; }
        .stat-row .v.g { color: var(--accent); }

        /* ── BAR ── */
        .bar-wrap {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.4rem;
        }

        .bar-fill {
            height: 100%;
            border-radius: 3px;
            background: var(--accent);
            transition: width 0.4s cubic-bezier(.4,0,.2,1);
        }

        .bar-fill.warn { background: var(--warn); }
        .bar-fill.danger { background: var(--danger); }

        /* ── VERMÖGEN ── */
        .wealth-section { grid-column: span 2; }

        .wealth-body {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        .wealth-input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .field-label {
            font-size: 0.67rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .field-input {
            font-family: var(--mono);
            font-size: 0.9rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 0.5rem 0.65rem;
            color: var(--text);
            outline: none;
            width: 100%;
            transition: border-color 0.15s;
        }

        .field-input:focus { border-color: var(--accent); }

        /* ── ZIEL ── */
        .goal-section { grid-column: span 2; }

        .goal-body { display: flex; flex-direction: column; gap: 1rem; }

        .goal-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 0.75rem;
            align-items: center;
        }

        .goal-bar-area { display: flex; flex-direction: column; gap: 0.35rem; }

        .goal-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--muted);
        }

        .goal-pct { font-weight: 500; }

        .goal-name-input, .goal-target-input {
            font-family: var(--mono);
            font-size: 0.82rem;
            background: none;
            border: none;
            border-bottom: 1px solid var(--border);
            padding: 0.2rem 0;
            color: var(--text);
            outline: none;
        }

        .goal-name-input:focus, .goal-target-input:focus { border-color: var(--accent); }
        .goal-target-input { width: 90px; text-align: right; }

        .chip {
            font-size: 0.65rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            font-weight: 500;
        }

        .chip.on-track { background: var(--accent-light); color: var(--accent); }
        .chip.behind   { background: var(--warn-light); color: var(--warn); }

        /* ── FREI VERFÜGBAR ── */
        .free-banner {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .free-banner .label {
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.3rem;
        }

        .free-banner .amount {
            font-family: var(--serif);
            font-size: 2.4rem;
            letter-spacing: -0.03em;
            line-height: 1;
        }

        .free-banner .amount.positive { color: var(--accent); }
        .free-banner .amount.negative { color: var(--danger); }

        .free-breakdown {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            font-size: 0.72rem;
            color: var(--muted);
            text-align: right;
        }

        .free-breakdown span { display: flex; gap: 1rem; justify-content: flex-end; }

        /* ── MONAT TOGGLE ── */
        .period-toggle {
            display: flex;
            gap: 0;
            border: 1px solid var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .period-toggle button {
            background: var(--surface);
            border: none;
            padding: 0.3rem 0.65rem;
            font-family: var(--mono);
            font-size: 0.68rem;
            color: var(--muted);
            cursor: pointer;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: all 0.1s;
            border-right: 1px solid var(--border);
        }

        .period-toggle button:last-child { border-right: none; }
        .period-toggle button.active { background: var(--accent); color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

        @media (max-width: 620px) {
            .summary { grid-template-columns: 1fr 1fr; }
            .grid { grid-template-columns: 1fr; }
            .savings-section, .wealth-section, .goal-section { grid-column: span 1; }
            .savings-body, .wealth-body { grid-template-columns: 1fr; gap: 1.25rem; }
            .free-banner { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
            .free-breakdown { text-align: left; }
            .free-breakdown span { justify-content: flex-start; }
        }
    </style>
</head>
<body>
<div class="container">

    <header>
        <h1>Finanzübersicht</h1>
        <div style="display:flex;align-items:center;gap:1rem;">
            <div class="period-toggle">
                <button class="active" onclick="setPeriod('month',this)">Monat</button>
                <button onclick="setPeriod('year',this)">Jahr</button>
            </div>
            <span id="date-label"></span>
        </div>
    </header>

    <!-- SUMMARY STRIP -->
    <div class="summary">
        <div class="summary-cell">
            <label>Einnahmen</label>
            <div class="val green" id="s-income">—</div>
            <div class="sub" id="s-income-sub"></div>
        </div>
        <div class="summary-cell">
            <label>Fixkosten</label>
            <div class="val" id="s-costs">—</div>
            <div class="sub" id="s-costs-pct"></div>
        </div>
        <div class="summary-cell">
            <label>Sparquote</label>
            <div class="val" id="s-savings-pct">—</div>
            <div class="sub" id="s-savings-abs"></div>
        </div>
        <div class="summary-cell">
            <label>Gesamtvermögen</label>
            <div class="val green" id="s-wealth">—</div>
            <div class="sub" id="s-wealth-sub"></div>
        </div>
    </div>

    <!-- FREI VERFÜGBAR BANNER -->
    <div class="free-banner">
        <div>
            <div class="label">Frei verfügbar</div>
            <div class="amount positive" id="free-amount">—</div>
        </div>
        <div class="free-breakdown">
            <span><span>Einnahmen</span><span id="fb-income">—</span></span>
            <span><span>− Fixkosten</span><span id="fb-costs">—</span></span>
            <span><span>− Sparbetrag</span><span id="fb-save">—</span></span>
        </div>
    </div>

    <div class="grid">

        <!-- EINNAHMEN -->
        <div class="section">
            <div class="section-head">
                <h2>Einnahmen</h2>
                <div class="total" id="income-total">0 €</div>
            </div>
            <div id="income-list"></div>
            <button class="add-btn" onclick="addItem('income')">+ Position</button>
        </div>

        <!-- FIXKOSTEN -->
        <div class="section">
            <div class="section-head">
                <h2>Fixkosten</h2>
                <div class="total" id="costs-total">0 €</div>
            </div>
            <div id="costs-list"></div>
            <button class="add-btn" onclick="addItem('costs')">+ Position</button>
        </div>

        <!-- SPARQUOTE -->
        <div class="section savings-section">
            <div class="section-head">
                <h2>Sparquote</h2>
            </div>
            <div class="savings-body">
                <div class="savings-controls">
                    <div class="slider-row">
                        <label>Sparrate <span id="rate-label">20%</span></label>
                        <input type="range" id="savings-rate" min="0" max="80" value="20" oninput="onRateChange(this.value)">
                        <div class="bar-wrap" style="margin-top:0.6rem">
                            <div class="bar-fill" id="savings-bar" style="width:20%"></div>
                        </div>
                    </div>
                    <div class="slider-row">
                        <label>Fixkosten-Anteil <span id="costs-pct-label">—</span></label>
                        <div class="bar-wrap">
                            <div class="bar-fill" id="costs-bar" style="width:0%"></div>
                        </div>
                    </div>
                </div>
                <div class="savings-stats">
                    <div class="stat-row"><span class="k">Sparbetrag / Monat</span><span class="v g" id="st-monthly">—</span></div>
                    <div class="stat-row"><span class="k">Sparbetrag / Jahr</span><span class="v g" id="st-yearly">—</span></div>
                    <div class="stat-row"><span class="k">In 5 Jahren</span><span class="v" id="st-5y">—</span></div>
                    <div class="stat-row"><span class="k">In 10 Jahren</span><span class="v" id="st-10y">—</span></div>
                </div>
            </div>
        </div>

        <!-- VERMÖGENSENTWICKLUNG -->
        <div class="section wealth-section">
            <div class="section-head">
                <h2>Vermögensentwicklung</h2>
            </div>
            <div class="wealth-body">
                <div class="wealth-input-group">
                    <div class="field-label">Aktuelles Vermögen (€)</div>
                    <input class="field-input" type="number" id="w-current" placeholder="0" oninput="recalc()">
                </div>
                <div class="wealth-input-group">
                    <div class="field-label">Rendite p.a. (%)</div>
                    <input class="field-input" type="number" id="w-return" placeholder="5" value="5" oninput="recalc()">
                </div>
                <div class="wealth-input-group">
                    <div class="field-label">Prognose</div>
                    <div style="display:flex;flex-direction:column;gap:0.4rem;margin-top:0.25rem;">
                        <div class="stat-row" style="padding:0.3rem 0"><span class="k">+1 J</span><span class="v" id="wp-1y">—</span></div>
                        <div class="stat-row" style="padding:0.3rem 0"><span class="k">+5 J</span><span class="v" id="wp-5y">—</span></div>
                        <div class="stat-row" style="padding:0.3rem 0"><span class="k">+10 J</span><span class="v" id="wp-10y">—</span></div>
                        <div class="stat-row" style="padding:0.3rem 0"><span class="k">+20 J</span><span class="v g" id="wp-20y">—</span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ZIELE -->
        <div class="section goal-section">
            <div class="section-head">
                <h2>Ziele</h2>
                <button class="add-btn" style="width:auto;padding:0.25rem 0.65rem;margin-top:0;border-style:solid;" onclick="addGoal()">+ Ziel</button>
            </div>
            <div class="goal-body" id="goals-list"></div>
        </div>

    </div>
</div>

<script>
    // ── STATE ──
    let state = {
        period: 'month',
        income: [],
        costs: [],
        savingsRate: 20,
        wealth: { current: 0, returnPct: 5 },
        goals: [],
        nextId: 100,
    };

    // ── PERSISTENCE ──
    function save() {
        try { localStorage.setItem('finanz_v1', JSON.stringify(state)); } catch(e) {}
    }
    function load() {
        try {
            const s = localStorage.getItem('finanz_v1');
            if (s) state = JSON.parse(s);
        } catch(e) {}
    }

    // ── FORMATTERS ──
    const fmt = (n) => n.toLocaleString('de-DE', { maximumFractionDigits: 0 }) + ' €';
    const fmtK = (n) => {
        if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(2).replace('.',',') + ' Mio. €';
        if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(1).replace('.',',') + 'k €';
        return fmt(n);
    };

    // ── PERIOD ──
    function setPeriod(p, btn) {
        state.period = p;
        document.querySelectorAll('.period-toggle button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
        save();
    }

    function periodFactor() { return state.period === 'year' ? 12 : 1; }

    // ── RENDER ITEMS ──
    function renderList(type) {
        const list = document.getElementById(type + '-list');
        const items = state[type];
        list.innerHTML = '';
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'line-item';
            div.innerHTML = `
      <input class="line-name" value="${item.name}" onchange="updateItem('${type}',${item.id},'name',this.value)" title="Name bearbeiten">
      <input class="line-amount" type="number" value="${item.amount}" onchange="updateItem('${type}',${item.id},'amount',+this.value)" title="Betrag (Monat)">
      <button class="line-del" onclick="delItem('${type}',${item.id})" title="Löschen">×</button>
    `;
            list.appendChild(div);
        });
    }

    function addItem(type) {
        state[type].push({ id: state.nextId++, name: 'Neue Position', amount: 0 });
        render(); save();
        // Focus new name
        setTimeout(() => {
            const inputs = document.querySelectorAll(`#${type}-list .line-name`);
            if (inputs.length) inputs[inputs.length-1].select();
        }, 50);
    }

    function delItem(type, id) {
        state[type] = state[type].filter(i => i.id !== id);
        render(); save();
    }

    function updateItem(type, id, field, val) {
        const item = state[type].find(i => i.id === id);
        if (item) item[field] = val;
        recalc(); save();
    }

    // ── GOALS ──
    function renderGoals() {
        const list = document.getElementById('goals-list');
        list.innerHTML = '';
        const wCurrent = parseFloat(document.getElementById('w-current').value) || 0;
        const monthlySave = calcMonthlySave();

        state.goals.forEach(g => {
            const pct = Math.min(100, wCurrent / g.target * 100);
            const remaining = Math.max(0, g.target - wCurrent);
            const monthsLeft = monthlySave > 0 ? remaining / monthlySave : Infinity;
            const yearsLeft = monthsLeft / 12;
            const onTrack = yearsLeft < 15 || pct >= 80;

            const div = document.createElement('div');
            div.innerHTML = `
      <div class="goal-row">
        <input class="goal-name-input" value="${g.name}" onchange="updateGoal(${g.id},'name',this.value)">
        <input class="goal-target-input" type="number" value="${g.target}" onchange="updateGoal(${g.id},'target',+this.value)">
        <button class="line-del" onclick="delGoal(${g.id})">×</button>
      </div>
      <div class="goal-bar-area" style="margin-top:0.5rem">
        <div class="bar-wrap"><div class="bar-fill${pct > 85 ? '' : pct > 60 ? ' warn' : ''}" style="width:${pct}%"></div></div>
        <div class="goal-meta">
          <span class="chip ${onTrack ? 'on-track' : 'behind'}">${onTrack ? '↑ Im Plan' : '↓ Hinterher'}</span>
          <span class="goal-pct">${pct.toFixed(1)}% · Noch ${fmtK(remaining)}</span>
        </div>
        <div class="goal-meta" style="margin-top:0.2rem">
          <span style="color:var(--muted);font-size:0.68rem">Ziel: ${fmt(g.target)}</span>
          <span style="color:var(--muted);font-size:0.68rem">${isFinite(yearsLeft) ? yearsLeft.toFixed(1) + ' J bis Ziel' : '—'}</span>
        </div>
      </div>
    `;
            div.style.marginBottom = '1rem';
            div.style.paddingBottom = '1rem';
            div.style.borderBottom = '1px solid var(--border)';
            list.appendChild(div);
        });
        // remove last border
        if (list.lastChild) list.lastChild.style.borderBottom = 'none';
    }

    function addGoal() {
        state.goals.push({ id: state.nextId++, name: 'Neues Ziel', target: 50000 });
        render(); save();
    }
    function delGoal(id) { state.goals = state.goals.filter(g => g.id !== id); render(); save(); }
    function updateGoal(id, field, val) {
        const g = state.goals.find(g => g.id === id);
        if (g) g[field] = val;
        recalc(); save();
    }

    // ── CALCULATE ──
    function sumItems(arr) { return arr.reduce((s,i) => s + (parseFloat(i.amount)||0), 0); }

    function calcMonthlySave() {
        const totalIncome = sumItems(state.income);
        return totalIncome * state.savingsRate / 100;
    }

    function futureWealth(current, monthlyAdd, rateAnnual, years) {
        const r = rateAnnual / 100 / 12;
        let w = current;
        for (let m = 0; m < years*12; m++) {
            w = w * (1 + r) + monthlyAdd;
        }
        return w;
    }

    function onRateChange(v) {
        state.savingsRate = +v;
        recalc(); save();
    }

    function recalc() {
        const pf = periodFactor();
        const totalIncome = sumItems(state.income);
        const totalCosts = sumItems(state.costs);
        const monthlySave = calcMonthlySave();
        const free = totalIncome - totalCosts - monthlySave;
        const costsPct = totalIncome > 0 ? totalCosts / totalIncome * 100 : 0;

        // Wealth inputs
        state.wealth.current = parseFloat(document.getElementById('w-current').value) || 0;
        state.wealth.returnPct = parseFloat(document.getElementById('w-return').value) || 0;
        const wCur = state.wealth.current;
        const wRet = state.wealth.returnPct;

        // ── Summary strip ──
        document.getElementById('s-income').textContent = fmt(totalIncome * pf);
        document.getElementById('s-income-sub').textContent = pf === 1 ? 'pro Monat' : 'pro Jahr';
        document.getElementById('s-costs').textContent = fmt(totalCosts * pf);
        document.getElementById('s-costs-pct').textContent = costsPct.toFixed(0) + '% des Einkommens';
        document.getElementById('s-savings-pct').textContent = state.savingsRate + '%';
        document.getElementById('s-savings-abs').textContent = fmt(monthlySave * pf) + ' gespart';
        document.getElementById('s-wealth').textContent = fmtK(wCur);
        document.getElementById('s-wealth-sub').textContent = 'Aktuell erfasst';

        // ── Free banner ──
        const freeEl = document.getElementById('free-amount');
        freeEl.textContent = fmt(free * pf);
        freeEl.className = 'amount ' + (free >= 0 ? 'positive' : 'negative');
        document.getElementById('fb-income').textContent = fmt(totalIncome * pf);
        document.getElementById('fb-costs').textContent = fmt(totalCosts * pf);
        document.getElementById('fb-save').textContent = fmt(monthlySave * pf);

        // ── Totals ──
        document.getElementById('income-total').textContent = fmt(totalIncome * pf);
        document.getElementById('costs-total').textContent = fmt(totalCosts * pf);

        // ── Savings section ──
        const rateVal = state.savingsRate;
        document.getElementById('savings-rate').value = rateVal;
        document.getElementById('rate-label').textContent = rateVal + '%';
        document.getElementById('savings-bar').style.width = rateVal + '%';
        const cPct = Math.min(100, costsPct);
        document.getElementById('costs-bar').style.width = cPct + '%';
        const cBar = document.getElementById('costs-bar');
        cBar.className = 'bar-fill' + (cPct > 75 ? ' danger' : cPct > 55 ? ' warn' : '');
        document.getElementById('costs-pct-label').textContent = costsPct.toFixed(0) + '%';

        document.getElementById('st-monthly').textContent = fmt(monthlySave);
        document.getElementById('st-yearly').textContent = fmt(monthlySave * 12);
        document.getElementById('st-5y').textContent = fmt(monthlySave * 12 * 5);
        document.getElementById('st-10y').textContent = fmt(monthlySave * 12 * 10);

        // ── Wealth prognosis ──
        document.getElementById('wp-1y').textContent = fmtK(futureWealth(wCur, monthlySave, wRet, 1));
        document.getElementById('wp-5y').textContent = fmtK(futureWealth(wCur, monthlySave, wRet, 5));
        document.getElementById('wp-10y').textContent = fmtK(futureWealth(wCur, monthlySave, wRet, 10));
        document.getElementById('wp-20y').textContent = fmtK(futureWealth(wCur, monthlySave, wRet, 20));

        // ── Goals ──
        renderGoals();
    }

    function render() {
        renderList('income');
        renderList('costs');
        recalc();
    }

    // ── INIT ──
    load();
    document.getElementById('w-current').value = state.wealth.current || '';
    document.getElementById('w-return').value = state.wealth.returnPct || 5;
    document.getElementById('savings-rate').value = state.savingsRate;

    const now = new Date();
    document.getElementById('date-label').textContent =
        now.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });

    render();
</script>
</body>
</html>
